<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية - قصر زهرة الياسمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #05070a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .glass-card { width: 100%; max-width: 550px; background: rgba(15, 20, 28, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 28px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .title { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #fff, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 15px; }
        .section-title { font-size: 14px; color: #ffd700; font-weight: bold; margin: 15px 0 8px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center;}
        input, textarea, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3); background: rgba(5, 8, 13, 0.8); color: #00f2fe; font-size: 14px; outline: none; margin-bottom: 10px; }
        textarea { resize: vertical; height: 80px; }
        .btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #d4af37); color: #000; }
        .btn-blue { background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.4); color: #00f2fe; }
        .btn-red { background: rgba(231, 76, 60, 0.15); border: 1px solid rgba(231, 76, 60, 0.4); color: #e74c3c; }
        .btn-green { background: rgba(37, 211, 102, 0.15); border: 1px solid rgba(37, 211, 102, 0.4); color: #25D366; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .poll-option-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 12px; margin-bottom: 10px; }
        .logs-container { max-height: 120px; overflow-y: auto; background: rgba(5, 8, 13, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 8px; font-size: 12px; }
    </style>
</head>
<body>

<div class="glass-card">
    <h1 class="title">👑 لوحة التحكم الذكية والمطوّرة</h1>

    <!-- قسم ربط الهاتف -->
    <div class="section-title">📱 اتصال الواتساب</div>
    <input type="text" id="phone" placeholder="أدخل الرقم: 966504790504">
    <button class="btn btn-gold" onclick="requestPairing()">⚡ طلب كود الإقران</button>
    <div id="pairCode" style="text-align: center; font-size: 18px; color: #00f2fe; margin-top: 5px;"></div>

    <!-- قسم الرسالة الترحيبية الأولى -->
    <div class="section-title">🖼️ الرسالة الترحيبية الأولى (صورة + نص)</div>
    <input type="text" id="welcomeImageUrl" placeholder="رابط صورة الترحيب (اختياري - اتركه فارغاً لنص فقط)">
    <textarea id="welcomeText" placeholder="نص الرسالة الترحيبية الأولى..."></textarea>

    <!-- قسم الذكاء الاصطناعي -->
    <div class="section-title">🤖 إعدادات الذكاء الاصطناعي (AI)</div>
    <input type="password" id="aiApiKey" placeholder="أدخل OpenAI API Key الخاص بك">
    <textarea id="aiPrompt" placeholder="تعليمات تدريب الذكاء الاصطناعي (مثال: أنت موظف استقبال في قصر زهرة الياسمين...)"></textarea>

    <!-- قسم الاستطلاعات والردود المصورة -->
    <div class="section-title">📊 محرر الاستطلاعات والخدمات المصوّرة</div>
    <input type="text" id="pollTitle" placeholder="عنوان الاستطلاع (مثال: أهلاً بك! اختر الخدمة المطلوبة)">
    
    <div id="pollOptionsContainer"></div>
    <button class="btn btn-blue" onclick="addPollOptionField()">➕ إضافة خيار جديد للاستطلاع</button>

    <button class="btn btn-green" style="margin-top: 15px;" onclick="saveSettings()">💾 حفظ جميع الإعدادات</button>

    <!-- التحكم والسجلات -->
    <div class="section-title">⚙️ التحكم بالسيرفر والأنظمة</div>
    <div class="btn-grid">
        <button class="btn btn-green" onclick="startBot()">▶️ تشغيل</button>
        <button class="btn btn-red" onclick="stopBot()">⏸️ إيقاف</button>
        <button class="btn btn-red" style="grid-column: span 2;" onclick="resetSession()">🗑️ تسجيل الخروج وربط رقم جديد</button>
    </div>

    <div class="section-title">📋 السجلات التفاعلية الحية</div>
    <div class="logs-container" id="logsContainer">جاري التحميل...</div>
</div>

<script>
let pollOptionsCount = 0;

function addPollOptionField(optionText = '', replyText = '', imageUrl = '') {
    pollOptionsCount++;
    const container = document.getElementById('pollOptionsContainer');
    const div = document.createElement('div');
    div.className = 'poll-option-box';
    div.id = `pollOpt_${pollOptionsCount}`;
    div.innerHTML = `
        <input type="text" class="opt-name" value="${optionText}" placeholder="اسم الخيار (مثال: 1️⃣ الأسعار)">
        <textarea class="opt-reply" placeholder="الرد النصي المجهز">${replyText}</textarea>
        <input type="text" class="opt-image" value="${imageUrl}" placeholder="رابط الصورة (اختياري - اتركه فارغاً لنص فقط)">
        <button class="btn btn-red" style="padding: 5px; font-size: 11px;" onclick="document.getElementById('pollOpt_${pollOptionsCount}').remove()">حذف الخيار</button>
    `;
    container.appendChild(div);
}

async function loadSettings() {
    try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        document.getElementById('welcomeImageUrl').value = data.welcomeImageUrl || '';
        document.getElementById('welcomeText').value = data.welcomeText || '';
        document.getElementById('aiApiKey').value = data.aiApiKey || '';
        document.getElementById('aiPrompt').value = data.aiPrompt || '';
        document.getElementById('pollTitle').value = data.pollTitle || '';
        
        document.getElementById('pollOptionsContainer').innerHTML = '';
        if (data.pollOptions && data.pollOptions.length > 0) {
            data.pollOptions.forEach(opt => addPollOptionField(opt.name, opt.reply, opt.image));
        } else {
            addPollOptionField('1️⃣ الأسعار والمعلومات', 'أسعارنا تبدأ من...', '');
            addPollOptionField('2️⃣ موقع القاعة', 'موقعنا على خرائط جوجل...', '');
        }
    } catch(e) {}
}

async function saveSettings() {
    const welcomeImageUrl = document.getElementById('welcomeImageUrl').value;
    const welcomeText = document.getElementById('welcomeText').value;
    const aiApiKey = document.getElementById('aiApiKey').value;
    const aiPrompt = document.getElementById('aiPrompt').value;
    const pollTitle = document.getElementById('pollTitle').value;

    const optionBoxes = document.querySelectorAll('.poll-option-box');
    const pollOptions = [];
    optionBoxes.forEach(box => {
        const name = box.querySelector('.opt-name').value;
        const reply = box.querySelector('.opt-reply').value;
        const image = box.querySelector('.opt-image').value;
        if (name) pollOptions.push({ name, reply, image });
    });

    const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ welcomeImageUrl, welcomeText, aiApiKey, aiPrompt, pollTitle, pollOptions })
    });
    const data = await res.json();
    alert(data.message);
}

async function requestPairing() {
    const phoneNumber = document.getElementById('phone').value;
    if (!phoneNumber) return alert("يرجى إدخال الرقم أولاً");
    const res = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber })
    });
    const data = await res.json();
    if(data.success) document.getElementById('pairCode').innerText = "كود الإقران: " + data.code;
    else alert(data.error);
}

async function resetSession() {
    if (!confirm("هل أنت تأكد من مسح الجلسة؟")) return;
    const res = await fetch('/api/reset-session', { method: 'POST' });
    const data = await res.json();
    alert(data.message);
}

async function fetchLogs() {
    try {
        const res = await fetch('/api/logs');
        const data = await res.json();
        const container = document.getElementById('logsContainer');
        if (!data.logs || data.logs.length === 0) {
            container.innerHTML = 'لا توجد سجلات حالياً';
            return;
        }
        container.innerHTML = data.logs.map(log => `<div><b>${log.from}:</b> ${log.text}</div>`).join('');
    } catch(e) {}
}

loadSettings();
setInterval(fetchLogs, 4000);
</script>
</body>
</html>
