<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم بوت الواتساب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .log-box { background: #1e1e1e; color: #00ff66; font-family: monospace; height: 250px; overflow-y: auto; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="text-center mb-4">🤖 لوحة إعدادات بوت الواتساب</h2>

    <!-- حالة البوت وإعادة الربط -->
    <div class="card p-3">
        <h5>⚙️ حالة الاتصال والجلسة</h5>
        <div class="d-flex align-items-center justify-content-between mt-2">
            <div>
                <span>الحالة الحالية: </span>
                <span id="botStatus" class="badge bg-secondary">جاري التحقق...</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="resetSession()">🗑️ تسجيل الخروج وإعادة الضبط</button>
        </div>
        <hr>
        <div class="row g-2">
            <div class="col-md-8">
                <input type="text" id="phoneNumber" class="form-control" placeholder="أدخل رقم الواتساب مع المفتاح الدولي (مثال: 967717521122)">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="requestPairingCode()">طلب كود الإقران</button>
            </div>
        </div>
        <div id="pairCodeDisplay" class="alert alert-info mt-3 text-center d-none" style="font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;"></div>
    </div>

    <!-- إعدادات الذكاء الاصطناعي -->
    <div class="card p-3">
        <h5>🧠 إعدادات الذكاء الاصطناعي (AI)</h5>
        
        <!-- حقل Groq المضاف حديثاً -->
        <div class="mb-3">
            <label class="form-label">مفتاح Groq API (مجاني وسريع):</label>
            <input type="password" id="groqApiKey" class="form-control" placeholder="gsk_...">
            <small class="text-muted">يمكنك الحصول عليه مجاناً من <a href="https://console.groq.com" target="_blank">console.groq.com</a></small>
        </div>

        <div class="mb-3">
            <label class="form-label">مفتاح OpenAI API (اختياري/احتياطي):</label>
            <input type="password" id="aiApiKey" class="form-control" placeholder="sk-proj-...">
        </div>

        <div class="mb-3">
            <label class="form-label">تعليمات البوت (Prompt):</label>
            <textarea id="aiPrompt" class="form-control" rows="2" placeholder="أنت موظف استقبال آلي، أجب بلباقة واختصار..."></textarea>
        </div>
    </div>

    <!-- إعدادات الترحيب والخدمات -->
    <div class="card p-3">
        <h5>📩 إعدادات الترحيب والخيارات</h5>
        <div class="mb-3">
            <label class="form-label">رابط صورة الترحيب (اختياري):</label>
            <input type="url" id="welcomeImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
        </div>
        <div class="mb-3">
            <label class="form-label">نص الرسالة الترحيبية:</label>
            <textarea id="welcomeText" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">عنوان قائمة الخيارات (الاستطلاع):</label>
            <input type="text" id="pollTitle" class="form-control">
        </div>

        <h6>الخيارات المتاحة للعملاء:</h6>
        <div id="optionsContainer"></div>
        
        <button class="btn btn-success mt-3 w-100" onclick="saveSettings()">💾 حفظ جميع الإعدادات</button>
    </div>

    <!-- سجل الرسائل -->
    <div class="card p-3">
        <h5>📜 سجل العمليات والرسائل</h5>
        <div id="logBox" class="log-box">جاري تحميل السجلات...</div>
    </div>
</div>

<script>
    let pollOptions = [];

    async function loadSettings() {
        try {
            const res = await fetch('/api/settings');
            const data = await res.json();
            
            document.getElementById('groqApiKey').value = data.groqApiKey || '';
            document.getElementById('aiApiKey').value = data.aiApiKey || '';
            document.getElementById('aiPrompt').value = data.aiPrompt || '';
            document.getElementById('welcomeImageUrl').value = data.welcomeImageUrl || '';
            document.getElementById('welcomeText').value = data.welcomeText || '';
            document.getElementById('pollTitle').value = data.pollTitle || '';
            
            pollOptions = data.pollOptions || [];
            renderOptions();
        } catch (e) {
            console.error('فشل تحميل الإعدادات:', e);
        }
    }

    function renderOptions() {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        pollOptions.forEach((opt, index) => {
            container.innerHTML += `
                <div class="border p-2 mb-2 rounded background-light">
                    <strong>خيار ${index + 1}: ${opt.name}</strong>
                    <div class="mt-1">
                        <small class="text-muted">الرد المتوقع:</small> ${opt.reply}
                    </div>
                </div>
            `;
        });
    }

    async function saveSettings() {
        const settingsData = {
            groqApiKey: document.getElementById('groqApiKey').value.trim(),
            aiApiKey: document.getElementById('aiApiKey').value.trim(),
            aiPrompt: document.getElementById('aiPrompt').value.trim(),
            welcomeImageUrl: document.getElementById('welcomeImageUrl').value.trim(),
            welcomeText: document.getElementById('welcomeText').value.trim(),
            pollTitle: document.getElementById('pollTitle').value.trim(),
            pollOptions: pollOptions
        };

        const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(settingsData)
        });

        const result = await res.json();
        alert(result.message || 'تم الحفظ بنجاح!');
    }

    async function checkStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            const badge = document.getElementById('botStatus');
            badge.innerText = data.status;
            badge.className = `badge ${data.status === 'متصل' ? 'bg-success' : 'bg-danger'}`;
        } catch (e) {}
    }

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = data.logs.map(l => `<div>[${l.time}] (${l.type}): ${l.from} -> ${l.text}</div>`).join('');
        } catch (e) {}
    }

    async function requestPairingCode() {
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        if (!phoneNumber) return alert('يرجى إدخال رقم الهاتف أولاً');
        
        const res = await fetch('/api/pair', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phoneNumber })
        });
        
        const data = await res.json();
        if (data.success) {
            const display = document.getElementById('pairCodeDisplay');
            display.innerText = `كود الإقران: ${data.code}`;
            display.classList.remove('d-none');
        } else {
            alert('حدث خطأ أثناء طلب كود الإقران');
        }
    }

    async function resetSession() {
        if (confirm('هل أنت تأكد من مسح الجلسة؟ سيتوجب عليك إعادة ربط البوت عبر الكود.')) {
            await fetch('/api/reset-session', { method: 'POST' });
            alert('تم إعادة ضبط الجلسة بنجاح.');
            location.reload();
        }
    }

    // تشغيل جلب البيانات والمراقبة عند الفتح
    loadSettings();
    checkStatus();
    fetchLogs();
    setInterval(checkStatus, 5000);
    setInterval(fetchLogs, 3000);
</script>

</body>
</html>
