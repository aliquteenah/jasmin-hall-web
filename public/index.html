<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصر زهرة الياسمين - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b132b;
    --card-bg: #1c2541;
    --accent-blue: #00f3ff;
    --accent-green: #00ff88;
    --accent-red: #ff3b5c;
    --text-color: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
  body { background: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
  
  .status-badge {
    align-self: center; padding: 8px 25px; border-radius: 50px; font-weight: bold; font-size: 1.1rem;
    display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-red); }
  .dot.online { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

  .card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.08); }
  .card h2 { font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

  input, textarea, button {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
    background: #0b132b; color: #fff; font-size: 1rem; margin-top: 10px; outline: none; text-align: center;
  }

  button { background: #0077b6; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
  button:hover { background: #0284c7; }

  /* Progress Bar */
  .progress-container {
    width: 100%; background: rgba(255, 255, 255, 0.1); border-radius: 10px;
    height: 8px; margin-top: 15px; overflow: hidden; display: none;
  }
  .progress-bar {
    width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
    transition: width 0.3s ease;
  }

  .code-display {
    margin-top: 15px; font-size: 1.8rem; font-weight: 900; color: var(--accent-green);
    letter-spacing: 4px; text-align: center; display: none; background: rgba(0,255,136,0.1);
    padding: 10px; border-radius: 12px; border: 1px dashed var(--accent-green);
  }
</style>
</head>
<body>

<div class="container">
  <div class="status-badge">
    <div id="statusDot" class="dot"></div>
    <span id="statusText">متوقف</span>
  </div>

  <div class="card">
    <h2>📊 إحصائيات النظام</h2>
    <p>عدد الرسائل التي تم رد عليها: <b id="repliedCount" style="color: var(--accent-blue);">0</b></p>
  </div>

  <div class="card">
    <h2>🔗 ربط حساب جديد</h2>
    <input type="text" id="phoneInput" placeholder="أدخل الرقم مع مفتاح الدولة (مثل: 967717521122)">
    <button onclick="requestPairingCode()">طلب رمز الاقتران</button>
    
    <div id="progressContainer" class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="codeDisplay" class="code-display"></div>
  </div>

  <div class="card">
    <h2>⚙️ إعدادات الرد التلقائي</h2>
    <label style="font-size: 0.9rem; color: #ccc;">نص الترحيب:</label>
    <textarea id="welcomeInput" rows="3"></textarea>
    <button onclick="saveSettings()" style="background: #2b9348;">حفظ التغييرات</button>
  </div>
</div>

<script>
  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      if (data.status === 'متصل') {
        dot.className = 'dot online';
        text.textContent = 'متصل';
      } else {
        dot.className = 'dot';
        text.textContent = 'متوقف';
      }

      document.getElementById('repliedCount').textContent = data.repliedCount;
      if (!document.getElementById('welcomeInput').value) {
        document.getElementById('welcomeInput').value = data.welcomeText;
      }
    } catch (e) {}
  }

  async function requestPairingCode() {
    const phone = document.getElementById('phoneInput').value;
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const codeDisplay = document.getElementById('codeDisplay');

    if (!phone) return alert('يرجى كتابة رقم الهاتف أولاً');

    codeDisplay.style.display = 'none';
    progressContainer.style.display = 'block';
    progressBar.style.width = '20%';

    let p = 20;
    const timer = setInterval(() => {
      if (p < 85) {
        p += 10;
        progressBar.style.width = p + '%';
      }
    }, 300);

    try {
      const res = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber: phone })
      });
      const data = await res.json();

      clearInterval(timer);
      if (data.success) {
        progressBar.style.width = '100%';
        setTimeout(() => {
          progressContainer.style.display = 'none';
          codeDisplay.textContent = data.code;
          codeDisplay.style.display = 'block';
        }, 300);
      } else {
        alert(data.error);
        progressContainer.style.display = 'none';
      }
    } catch (err) {
      clearInterval(timer);
      alert('حدث خطأ أثناء التواصل مع السيرفر');
      progressContainer.style.display = 'none';
    }
  }

  async function saveSettings() {
    const text = document.getElementById('welcomeInput').value;
    try {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      alert(data.message || data.error);
    } catch(e) {
      alert('تعذر حفظ التغييرات');
    }
  }

  fetchStatus();
  setInterval(fetchStatus, 3000);
</script>
</body>
</html>
